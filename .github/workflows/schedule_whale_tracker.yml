name: 🐋 Phase 3 · Kraken Whale Tracker

on:
  schedule:
    # Runs every 15 minutes, 24 hours a day, 7 days a week.
    # Fits comfortably within GitHub Actions free tier (2,000 min/month).
    # Change to '*/5 * * * *' for every 5 min (requires paid plan).
    - cron: '*/15 * * * *'
  workflow_dispatch:  # also allows manual trigger from the Actions tab

jobs:
  whale-scan:
    name: Scan Kraken Altcoins for Whale Movements
    runs-on: ubuntu-latest
    timeout-minutes: 14  # stays within the 15-min window; kills if it hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run whale tracker
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python whale_tracker.py
