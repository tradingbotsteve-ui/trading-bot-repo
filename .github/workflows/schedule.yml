name: Trading Bot Full Schedule

on:
  schedule:
    # ── 5:00 AM Pacific = 13:00 UTC ── Morning Brief (Mon–Fri)
    - cron: '0 13 * * 1-5'
    # ── 6:00 PM Pacific = 02:00 UTC next day ── EOD Recap (Mon–Fri)
    - cron: '0 2 * * 2-6'

  # Manual trigger — lets you run either phase from the Actions tab
  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - eod

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      # ── Determine phase from schedule time or manual input ──
      - name: 🕐 Detect which phase to run
        id: detect_phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +"%H")
            if [ "$HOUR" = "13" ]; then
              echo "phase=morning" >> $GITHUB_OUTPUT
            else
              echo "phase=eod" >> $GITHUB_OUTPUT
            fi
          fi

      # ── 5 AM run ──
      - name: 🌅 Run Morning Brief (5 AM — Watchlist + Full Market Scan)
        if: steps.detect_phase.outputs.phase == 'morning'
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          EMAIL_ADDRESS:     ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
        run: python trading_bot.py --phase morning

      # ── 6 PM run ──
      - name: 🌆 Run End-of-Day Recap (6 PM — Watchlist Recap)
        if: steps.detect_phase.outputs.phase == 'eod'
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          EMAIL_ADDRESS:     ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
        run: python trading_bot.py --phase eod
