# ============================================================
#  GitHub Actions — Trading Bot Full Schedule
#
#  REPLACE your existing .github/workflows/schedule.yml
#  with this entire file.
#
#  Three jobs, three emails, weekdays only:
#
#    7:00 AM PT  → "Morning Brief"   (Phase 1 + 2)  trading_bot.py
#    8:00 AM PT  → "Options Brief"   (Phase 3)       options_bot.py
#    5:00 PM PT  → "Evening Update"  (Phase 1)       trading_bot.py
#
#  UTC conversions (PDT = UTC-7, Apr-Oct):
#    7 AM PDT  = 14:00 UTC
#    8 AM PDT  = 15:00 UTC
#    5 PM PDT  = 00:00 UTC (midnight UTC = Mon-Fri evening PT)
# ============================================================

name: Trading Bot Options

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 7:00 AM PDT  — Morning Brief
    - cron: "0 15 * * 1-5"   # 8:00 AM PDT  — Options Brief
    - cron: "0 0 * * 2-6"    # 5:00 PM PDT  — Evening Update

  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "options"
        type: choice
        options:
          - options
    

env:
  ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
  EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
  EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
  EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}

jobs:

  # ── 8:00 AM — Options Brief (Phase 3) ──────────────────────
  options-brief:
    name: "Options Brief — 8 AM"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 15')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'options')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance textblob requests pandas
      - run: python phase3_options.py
        timeout-minutes: 180
