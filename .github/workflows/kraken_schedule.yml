name: 📊 Phase 4 · Kraken Crypto Advisor

on:
  schedule:
    # ─────────────────────────────────────────────────────────────
    # Runs every 15 minutes, 24 hours a day, 7 days a week.
    # GitHub Actions free tier = 2,000 min/month.
    # This job takes ~3-4 min × 96 times/day = ~330 min/day = fine.
    # Change to '*/5 * * * *' for every 5 min (uses ~700 min/day).
    # ─────────────────────────────────────────────────────────────
    - cron: '*/59 * * * *'

  # Also allows you to trigger it manually from the Actions tab
  workflow_dispatch:

jobs:
  kraken-advisor:
    name: Scan Kraken Altcoins — Buy / Hodl / Watch / Skip
    runs-on: ubuntu-latest
    timeout-minutes: 14  # stays safely within the 15-min window

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Phase 4 Kraken Advisor
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python phase4_kraken_advisor.py
