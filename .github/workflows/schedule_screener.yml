# ============================================================
#  GitHub Actions — Trading Bot Schedule
#
#  REPLACE your existing .github/workflows/schedule.yml
#  with this file entirely.
#
#  ONE Python file (trading_bot.py) — TWO emails per day:
#    7:00 AM PT  → Morning Brief  (full scan + watchlist)
#    5:00 PM PT  → Evening Update (watchlist only)
#
#  UTC conversions (PDT = UTC-7, Apr–Oct):
#    7 AM PDT = 14:00 UTC
#    5 PM PDT = 00:00 UTC (midnight, next calendar day in UTC)
#
#  Weekdays only (markets are closed on weekends).
# ============================================================

name: Trading Bot

on:
  schedule:
    # 7:00 AM PDT (UTC-7) = 14:00 UTC — Morning full report
    - cron: "0 14 * * 1-5"

    # 5:00 PM PDT (UTC-7) = 00:00 UTC — Evening watchlist update
    # Note: 00:00 UTC on Tue-Sat = Mon-Fri evening Pacific
    - cron: "0 0 * * 2-6"

  # Manual trigger — pick morning or evening from the GitHub UI
  workflow_dispatch:
    inputs:
      session:
        description: "Which report to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

env:
  ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
  EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
  EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
  EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}

jobs:

  morning-brief:
    name: "Morning Brief (7 AM)"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 14')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'morning')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance textblob requests
      - run: python phase2_screener.py morning
        timeout-minutes: 90

  evening-update:
    name: "Evening Update (5 PM)"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 0')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'evening')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance textblob requests
      - run: python phase2_screener.py evening
        timeout-minutes: 20
