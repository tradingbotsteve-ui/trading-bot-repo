name: Crypto Bot Daily - Kraken

on:
  schedule:
    - cron: "0 15 * * 1-5"   # 8:00 AM PDT, weekdays only
  workflow_dispatch:

env:
  EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
  EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
  EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}

jobs:
  crypto-brief:
    name: "Crypto Brief — 8 AM"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run crypto bot
        env:
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python Crypto_Bot/crypto_bot.py
